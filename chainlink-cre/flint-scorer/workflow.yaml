# ==========================================================================
# CRE WORKFLOW SETTINGS FILE
# ==========================================================================
staging-settings:
  user-workflow:
    workflow-name: "flint-scorer-staging"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.staging.json"
    secrets-path: "../secrets.yaml"
  write-target:
    chain-name: ethereum-testnet-sepolia-base-1
    contract-address: "${RECEIVER_ADDRESS}"

# ==========================================================================
production-settings:
  user-workflow:
    workflow-name: "flint-scorer-production"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.production.json"
    secrets-path: "../secrets.yaml"
  write-target:
    chain-name: ethereum-testnet-sepolia-base-1
    contract-address: "${RECEIVER_ADDRESS}"
