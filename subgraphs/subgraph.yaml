# Flint subgraph — Arc Testnet (chain 5042002, The Graph network id: arc-testnet).
# Addresses: ARC_Contract.md. All contracts deployed in blocks 61595122-61595123.
specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: FlintReceipt
    network: arc-testnet
    source:
      address: "0xD1758e1205f79C4F2dAc8f6b7D32A2E517835851"
      abi: FlintReceipt
      startBlock: 61595122
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Contributor
        - Repository
        - RepoMembership
        - Receipt
      abis:
        - name: FlintReceipt
          file: ../contracts/abi/FlintReceipt.json
      eventHandlers:
        - event: ReceiptMinted(indexed address,indexed uint256,indexed bytes32,uint256,uint256,uint256,string)
          handler: handleReceiptMinted
      file: ./src/mapping-receipt.ts
  - kind: ethereum
    name: FlintEscrow
    network: arc-testnet
    source:
      address: "0xA6872e0f927926CA850c970fdb06E9AD3B03FE12"
      abi: FlintEscrow
      startBlock: 61595122
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Pool
        - Repository
        - RepoMembership
        - Contributor
        - Payout
      abis:
        - name: FlintEscrow
          file: ../contracts/abi/FlintEscrow.json
      eventHandlers:
        - event: PoolCreated(indexed bytes32,indexed address,address,uint256,string,uint256)
          handler: handlePoolCreated
        - event: PayoutApproved(indexed bytes32,indexed uint256,indexed address)
          handler: handlePayoutApproved
        - event: PayoutExecuted(indexed bytes32,indexed uint256,indexed address,uint256)
          handler: handlePayoutExecuted
        - event: PoolReclaimed(indexed bytes32,indexed address,uint256)
          handler: handlePoolReclaimed
        - event: TimeoutPayoutExecuted(indexed bytes32,indexed uint256)
          handler: handleTimeoutPayoutExecuted
      file: ./src/mapping-escrow.ts
  - kind: ethereum
    name: FlintGrant
    network: arc-testnet
    source:
      address: "0x850fB024B03310A17888EC5174B93dDB90Fa91ed"
      abi: FlintGrant
      startBlock: 61595122
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Grant
        - Milestone
        - Tranche
        - Contributor
      abis:
        - name: FlintGrant
          file: ../contracts/abi/FlintGrant.json
      eventHandlers:
        - event: GrantCreated(indexed uint256,indexed address,indexed address,address,uint256,uint256)
          handler: handleGrantCreated
        - event: MilestoneVerified(indexed uint256,indexed uint256,uint256)
          handler: handleMilestoneVerified
        - event: TrancheReleased(indexed uint256,indexed uint256,indexed address,uint256)
          handler: handleTrancheReleased
        - event: TrancheAutoReleased(indexed uint256,indexed uint256,uint256)
          handler: handleTrancheAutoReleased
        - event: GrantCompleted(indexed uint256)
          handler: handleGrantCompleted
        - event: GrantReclaimed(indexed uint256,indexed address,uint256)
          handler: handleGrantReclaimed
      file: ./src/mapping-grant.ts
